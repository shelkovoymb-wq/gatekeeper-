# gatekeeper-proxy на traefik-ha (.44). Раздаёт трафик между backend api и Next.js web,
# которые крутятся в LXC на pve3 (192.168.1.25): api :3000, web :3001.

upstream gk_api { server 192.168.1.25:3000; }
upstream gk_web { server 192.168.1.25:3001; }

server {
    listen 80;
    server_name gatekeeper.skud24.ru;
    client_max_body_size 4m;

    # Общие заголовки проксирования (наследуются во все location).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;

    # ─── Backend API (NestJS) ───
    location /healthz  { proxy_pass http://gk_api; }
    location /v1/      { proxy_pass http://gk_api; }
    location /tg/      { proxy_pass http://gk_api; }
    location /payments { proxy_pass http://gk_api; }

    # ─── Next.js админ-панель (всё остальное, включая её собственные /api BFF-роуты) ───
    location / {
        proxy_pass http://gk_web;
        proxy_buffering off;   # для SSE (/api/chat/stream) и стриминга Next
        proxy_set_header Connection '';
    }
}
