# gatekeeper-proxy: nginx на traefik-ha (.44). Path-split между NestJS API (LXC :3000)
# и Next.js админкой (LXC :3001, включая её BFF-роуты /api/*).
# Файл монтируется в контейнер как /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name gatekeeper.skud24.ru;
    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;

    # ─── Backend API (NestJS) ───
    location /healthz  { proxy_pass http://192.168.1.25:3000; }
    location /v1/      { proxy_pass http://192.168.1.25:3000; }
    location /tg/      { proxy_pass http://192.168.1.25:3000; }
    location /payments { proxy_pass http://192.168.1.25:3000; }

    # ─── Next.js админ-панель (всё остальное, включая её /api BFF-роуты) ───
    location / {
        proxy_pass http://192.168.1.25:3001;
        proxy_buffering off;
        proxy_set_header Connection '';
    }
}
