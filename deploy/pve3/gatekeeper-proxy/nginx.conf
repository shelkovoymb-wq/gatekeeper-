# gatekeeper-proxy: nginx на traefik-ha (.44). Path-split между NestJS API (LXC :3000)
# и Next.js админкой (LXC :3001, включая её BFF-роуты /api/*).
# Файл монтируется в контейнер как /etc/nginx/conf.d/default.conf.
#
# ВАЖНО (security fix, security review 2026-08-06): Next.js BFF (apps/web)
# ходит в api ТОЛЬКО по внутренней docker-сети LXC (BACKEND_URL=http://api:3000,
# см. deploy/pve3/docker-compose.yml) — публичная проксировка /v1/* отсюда
# никогда не была нужна самому приложению. Раньше весь /v1/ пробрасывался
# наружу, из-за чего сервис-токен-эндпоинты (/v1/admin/*, /v1/bots,
# /v1/channels, /v1/plans, /v1/subscriptions — рассчитанные ТОЛЬКО на вызов
# из BFF, см. комментарии в apps/api/src/admin/admin.controller.ts) были
# напрямую доступны из интернета любому, кто узнает общий сервисный токен.
# Публично нужны только пути, куда стучатся внешние стороны напрямую:
# платёжные провайдеры (вебхуки, теперь с проверкой подписи) и Telegram
# (webhook-режим бота, сейчас не используется — боты на long polling —
# но оставлен на случай возврата к webhook-режиму).
server {
    listen 80;
    server_name gatekeeper.skud24.ru;
    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;

    # ─── Backend API (NestJS) — только то, что реально дёргают снаружи ───
    location /healthz          { proxy_pass http://192.168.1.25:3000; }
    location /tg/               { proxy_pass http://192.168.1.25:3000; }
    location /payments/webhook/ { proxy_pass http://192.168.1.25:3000; }
    # Вебхук оплаты платных опций (клиент платит платформе). Путь отдельный от
    # /payments/webhook/ намеренно: там деньги подписчиков клиентам, здесь —
    # деньги клиентов платформе, и шлюз тут один, наш собственный кабинет.
    location /billing/addon/    { proxy_pass http://192.168.1.25:3000; }

    # ─── Next.js админ-панель (всё остальное, включая её /api BFF-роуты) ───
    # Загрузка вложений поста идёт через BFF, а Telegram принимает файлы до
    # 50 МБ: общий лимит в 4 МБ обрезал бы видео ещё на подходе.
    location /api/posts/media {
        client_max_body_size 50m;
        proxy_pass http://192.168.1.25:3001;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://192.168.1.25:3001;
        proxy_buffering off;
        proxy_set_header Connection '';
    }
}
