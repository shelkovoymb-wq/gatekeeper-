# Gatekeeper — деплой в домашней лабе на хосте traefik-ha (192.168.1.44).
# Реквизиты подтверждены разведкой по хосту:
#   - внешняя docker-сеть Traefik: skud24-traefik_traefik-net
#   - certresolver: le (Let's Encrypt, HTTP-01)
#   - entrypoints: web (80 → редирект) / websecure (443, TLS le)
# Стек Traefik лежит в /opt/skud24-traefik. Если Traefik нет — см. README, «Без Traefik».

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatekeeper}
      POSTGRES_DB: gatekeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://gatekeeper:${POSTGRES_PASSWORD:-gatekeeper}@postgres:5432/gatekeeper
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=skud24-traefik_traefik-net
      - traefik.http.routers.gatekeeper-api.rule=Host(`gatekeeper.skud24.ru`)
      - traefik.http.routers.gatekeeper-api.entrypoints=websecure
      - traefik.http.routers.gatekeeper-api.tls.certresolver=le
      - traefik.http.services.gatekeeper-api.loadbalancer.server.port=3000

volumes:
  pgdata:
  redisdata:

networks:
  internal:
  # Внешняя сеть Traefik на хосте traefik-ha (создаётся стеком /opt/skud24-traefik).
  traefik:
    external: true
    name: skud24-traefik_traefik-net
